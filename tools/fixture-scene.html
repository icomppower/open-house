<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture scene</title>
<style>body{margin:0;background:#111}#stage{width:1200px}</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Renders the sample house from the recorded layout (catalog materials + furniture) at the
// recorded cameras. tools/render-fixtures.mjs calls window.shoot() and saves the JPEGs into
// fixtures/photos/ as the six "phone photos".
import { createViewer } from '../src/viewer/viewer.js';

const layout = await (await fetch('../fixtures/mock/layout.json')).json();
const spec = await (await fetch('../fixtures/mock/spec.json')).json();
const params = new URLSearchParams(location.search);
const viewer = createViewer({ container: document.getElementById('stage'), layout, spec, options: { sun: params.get('sun') || 'day', showControls: false, glideMs: 0, quality: 'high' } });
window.__viewer = viewer;

// A "phone photo" look: neutral daylight, slightly cool and flat, mild vignette, JPEG.
window.shoot = async function shoot({ grade = true } = {}) {
  const shots = await viewer.captureStops({ width: 1200, height: 900 });
  const out = [];
  for (const s of shots) {
    const img = new Image(); img.src = s.image; await img.decode();
    const c = document.createElement('canvas'); c.width = 1200; c.height = 900;
    const ctx = c.getContext('2d');
    if (grade) {
      ctx.filter = 'saturate(0.88) contrast(0.97) brightness(1.02)';
      ctx.drawImage(img, 0, 0);
      ctx.filter = 'none';
      ctx.fillStyle = 'rgba(120,150,200,0.05)'; ctx.fillRect(0, 0, 1200, 900);
    } else ctx.drawImage(img, 0, 0);
    out.push({ photoId: s.photoId, jpeg: c.toDataURL('image/jpeg', 0.8) });
  }
  return out;
};
window.__ready = true;
</script>
</body>
</html>
